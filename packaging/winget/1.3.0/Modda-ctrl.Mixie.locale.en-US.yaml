ShortDescription: Per-app volume mixer for Windows with a pixel buddy who dances to your music.
Description: |-
  Mixie gives every program that plays sound its own slider - Spotify, your browser, your game, Discord - in one
  small window for your second monitor. Profiles, in-game hotkeys, a microphone slider, per-app audio devices,
  and it lowers the music when someone talks on Discord. Mixie, the pixel buddy, dances on the beat of your music.
